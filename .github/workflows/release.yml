name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Package extension
        run: |
          cd dist
          zip -qr "../markdown-reader-${GITHUB_REF_NAME}.zip" .

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: markdown-reader-${{ github.ref_name }}.zip
          generate_release_notes: true
